name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the strictest target (path length, .cmd shims, taskkill), so
    # it is the one that must stay green.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
