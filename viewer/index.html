<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DAG Orchestrator</title>
<style>
  :root {
    --bg: #04070d; --panel: #0b1220; --border: #1e2a3f; --text: #d7f5ff;
    --muted: #6f9db4; --dim: #3d6379; --cyan: #00e5ff; --green: #00ff9c;
    --amber: #ffc400; --magenta: #ff2d95; --teal: #2dd4bf; --slate: #55788c;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--mono); }
  header { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .brand { font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 10px rgba(0,229,255,.5); }
  .muted { color: var(--muted); font-size: 11px; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px; }
  button { border: 1px solid rgba(0,229,255,.4); border-radius: 3px; background: rgba(0,229,255,.08);
    color: var(--cyan); font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,.3); }
  input { background: #03070c; color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 7px; font: 11.5px var(--mono); }
  .project { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 14px;
    background: var(--panel); }
  .phead { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-bottom: 1px solid var(--border); }
  .pname { font-weight: 600; }
  .ppath { color: var(--dim); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 380px; }
  .phead .spacer { margin-left: auto; }
  .run { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    border-bottom: 1px solid rgba(30,42,63,.5); text-decoration: none; color: inherit; }
  .run:last-child { border-bottom: none; }
  .run:hover { background: rgba(0,229,255,.06); }
  .run .obj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .id { color: var(--dim); font-size: 10.5px; }
  .tag { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; border-radius: 2px;
    padding: 1px 6px; border: 1px solid var(--border); color: var(--muted); }
  .tag.active { color: #02130c; background: var(--green); border-color: var(--green); font-weight: 700; }
  .tag.archived { color: var(--slate); border-style: dashed; }
  .tag.running { color: #451a03; background: var(--amber); border-color: var(--amber); font-weight: 700; }
  .counts { display: flex; gap: 8px; font-size: 10.5px; color: var(--muted); }
  .counts b { color: var(--text); }
  .empty { color: var(--dim); padding: 14px; font-size: 12px; }
  #addbox { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  #addbox input { flex: 1; }
  .note { font-size: 11px; color: var(--muted); }
  .note.err { color: var(--magenta); }
</style>
</head>
<body>
<header>
  <span class="brand">DAG Orchestrator</span>
  <span class="muted" id="meta">loading…</span>
</header>
<main>
  <div id="addbox">
    <input id="newdir" placeholder="absolute path to a project folder (e.g. C:\work\my-app)" />
    <button id="addBtn">Add project</button>
    <span class="note" id="note"></span>
  </div>
  <div id="projects"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);

function note(msg, isError) {
  const el = $('note');
  el.textContent = msg || '';
  el.className = 'note' + (isError ? ' err' : '');
}

function counts(row) {
  const order = ['running', 'ready', 'failed', 'blocked', 'gated', 'completed', 'pending'];
  return order
    .filter((k) => row.counts && row.counts[k])
    .map((k) => `<span>${k} <b>${row.counts[k]}</b></span>`)
    .join('');
}

function runRow(row) {
  const running = row.job && row.job.running;
  const tag = running
    ? '<span class="tag running">running</span>'
    : row.archived
      ? '<span class="tag archived">archived</span>'
      : '<span class="tag active">active</span>';
  const runId = escapeHtml(row.runId);
  return `<a class="run" href="/r/${encodeURIComponent(row.runId)}">
    ${tag}
    <span class="id">${runId}</span>
    <span class="obj">${escapeHtml(row.objective || '(no objective)')}</span>
    <span class="counts">${counts(row)}</span>
    <span class="id">${row.total} tasks</span>
  </a>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function load() {
  const res = await fetch('/api/runs');
  const data = await res.json();
  const projects = data.projects || [];
  $('meta').textContent =
    `${projects.length} project(s) · ${projects.reduce((n, p) => n + p.runs.length, 0)} run(s) · ${location.host}`;
  $('projects').innerHTML =
    projects.length === 0
      ? '<div class="empty">No projects yet. Add one above — it registers the folder and creates its first run.</div>'
      : projects
          .map(
            (p) => `<div class="project">
              <div class="phead">
                <span class="pname">${escapeHtml(p.name)}</span>
                <span class="ppath" title="${escapeHtml(p.dir)}">${escapeHtml(p.dir)}</span>
                <span class="spacer"></span>
                <button data-new="${escapeHtml(p.dir)}">New run</button>
              </div>
              ${p.runs.length === 0 ? '<div class="empty">no runs yet</div>' : p.runs.map(runRow).join('')}
            </div>`,
          )
          .join('');
  for (const btn of document.querySelectorAll('button[data-new]')) {
    btn.onclick = async () => {
      const dir = btn.dataset.new;
      const objective = prompt('Objective for the new run?');
      if (objective === null) return;
      note('archiving and starting a new run…');
      const r = await fetch('/api/runs/new', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ dir, objective }),
      });
      const out = await r.json();
      if (!r.ok) note(out.error || 'failed', true);
      else note(`created ${out.runId}${out.archivedTo ? ' (previous run archived)' : ''}`);
      await load();
    };
  }
}

$('addBtn').onclick = async () => {
  const dir = $('newdir').value.trim();
  if (!dir) return;
  note('registering…');
  const r = await fetch('/api/projects', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ dir }),
  });
  const out = await r.json();
  if (!r.ok) note(out.error || 'failed', true);
  else note(`registered ${out.project.name}`);
  $('newdir').value = '';
  await load();
};

load();
setInterval(load, 5000);
</script>
</body>
</html>
